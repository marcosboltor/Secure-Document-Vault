[project]
name = "vault-backend"
version = "0.1.0"
description = "Secure Document Vault - Backend API"
readme = "README.md"
authors = [
    { name = "Daniel Adrian Galindo Reyes", email = "mseragonf@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.0",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30.0",
    "cryptography>=46.0.0"
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "flake8>=7.3.0",
    "pytest>=9.0.2",
    "httpx>=0.27.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]